{% load socialaccount %}
{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>
  <link rel="stylesheet" href="{% static 'Lost_found_Web/login.css' %}">
</head>
<body>

  <div class="background"></div>

  <div class="card">

    <h1 class="app-title">🔥 finder</h1>
    <p class="subtitle">落とし物を見つけよう</p>

    <!-- メッセージ表示（全部出す） -->
    {% if messages %}
      <div class="message-area">
        {% for message in messages %}
          <div class="alert {{ message.tags }}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <!-- Googleログイン -->
    <a href="{% provider_login_url 'google' next='/' %}" class="google-btn">
      <img src="https://developers.google.com/identity/images/g-logo.png" class="google-icon">
      Googleでログイン
    </a>

    <p class="note">
      学内アカウント（@shibaura-it.ac.jp）でログインしてください
    </p>

  </div>

</body>
</html>
